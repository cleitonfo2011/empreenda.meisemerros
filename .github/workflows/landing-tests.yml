name: Validar landing
on:
  pull_request:
    paths:
      - 'public/**'
      - 'test/**'
      - 'server.mjs'
      - 'package.json'
      - '.github/workflows/landing-tests.yml'
  push:
    branches:
      - 'feat/landing-conversao-trafego-pago-20261112'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Testes automatizados
        run: npm test
